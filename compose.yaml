name: flipkart-bbd-elastic-scaling
services:
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${GATEWAY_PORT:-8081}:80"]
    volumes: ["./infrastructure/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
      dashboard-frontend: {condition: service_healthy}
      monitoring-api: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_BASE_URL: "", VITE_DASHBOARD_URL: "/dashboard/"}
    healthcheck: &webhealth
      test: [CMD, wget, -q, --spider, "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
      ENVIRONMENT: LOCAL_DOCKER
      DB_SSL_REJECT_UNAUTHORIZED: ${LOCAL_DB_TLS_VERIFY:-false}
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:5000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  dashboard-frontend:
    build: ./dashboard/frontend
    healthcheck: *webhealth
    restart: unless-stopped
  monitoring-api:
    build: ./dashboard/monitoring-api
    environment:
      PORT: 5001
      NODE_ENV: production
      ENVIRONMENT: LOCAL_DOCKER
      COLLECTOR_URL: http://collector:9100/snapshot
      RESULTS_DIR: /results
    volumes: ["./load-tests/results:/results:ro"]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:5001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  collector:
    build: ./infrastructure/collector
    environment:
      COMPOSE_PROJECT: flipkart-bbd-elastic-scaling
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  k6:
    image: grafana/k6:1.3.0
    profiles: [load-test]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      BASE_URL: http://gateway
    volumes: ["./load-tests:/scripts"]
