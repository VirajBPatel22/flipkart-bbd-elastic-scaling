server {
    listen 80;
    root /usr/share/nginx/html;
    auth_basic "IT457 monitoring";
    auth_basic_user_file /etc/nginx/bbd.htpasswd;
    location = /healthz { auth_basic off; default_type text/plain; return 200 "healthy\n"; }
    location /monitoring-api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:5001/;
        proxy_read_timeout 30s;
    }
    location /dashboard/ {
        rewrite ^/dashboard/(.*)$ /$1 break;
        try_files $uri /dashboard/index.html;
    }
    location = /dashboard { return 301 /dashboard/; }
    location / { return 404; }
}
