resolver 127.0.0.11 valid=2s ipv6=off;
upstream backends {
    zone backend_pool 64k;
    server backend:5000 resolve max_fails=1 fail_timeout=2s;
}
server {
    listen 80;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    location = /internal/metrics { return 404; }
    location /api/ {
        proxy_pass http://backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503;
    }
    location = /dashboard { return 301 /dashboard/; }
    location /dashboard/ {
        set $dashboard dashboard-frontend:80;
        rewrite ^/dashboard/(.*)$ /$1 break;
        proxy_pass http://$dashboard;
    }
    location /monitoring-api/ {
        proxy_set_header Host $http_host;
        set $monitor monitoring-api:5001;
        rewrite ^/monitoring-api/(.*)$ /$1 break;
        proxy_pass http://$monitor;
    }
    location / {
        set $store frontend:80;
        proxy_pass http://$store;
    }
}
