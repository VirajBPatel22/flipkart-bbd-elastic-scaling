server {
    listen 80;
    root /usr/share/nginx/html;
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /healthz { default_type text/plain; return 200 "healthy\n"; }
}
